<header class="topbar">
  <button
    type="button"
    class="topbar-toggle"
    aria-label="Abrir menú"
    (click)="toggleSidebar.emit()"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <span class="topbar-title">Panel administrador</span>

  <div class="topbar-actions">
    @if (auth.user(); as user) {
      <span class="topbar-user">{{ user.email }}</span>
    }
    <a routerLink="/" class="topbar-link">Volver al sitio</a>
    <button type="button" class="topbar-logout" (click)="auth.logout()">Cerrar sesión</button>
  </div>
</header>
