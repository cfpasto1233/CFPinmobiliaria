<div class="fotos-carousel">
  <div class="fotos-carousel-viewport">
    @if (active(); as foto) {
      <img [src]="foto.url" alt="Foto adicional del proyecto" class="fotos-carousel-img" />
      @if (foto.descripcion) {
        <p class="fotos-carousel-caption">{{ foto.descripcion }}</p>
      }
    }

    @if (fotos().length > 1) {
      <button type="button" class="fotos-carousel-nav fotos-carousel-nav-prev" (click)="prev()" aria-label="Foto anterior">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
      <button type="button" class="fotos-carousel-nav fotos-carousel-nav-next" (click)="next()" aria-label="Siguiente foto">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6" />
        </svg>
      </button>
    }
  </div>

  @if (fotos().length > 1) {
    <div class="fotos-carousel-dots">
      @for (foto of fotos(); track foto.id; let i = $index) {
        <button
          type="button"
          class="fotos-carousel-dot"
          [class.is-active]="i === activeIndex()"
          (click)="goTo(i)"
          [attr.aria-label]="'Ir a la foto ' + (i + 1)"
        ></button>
      }
    </div>
  }
</div>
