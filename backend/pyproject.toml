[project]
name = "app"
version = "0.1.0"
description = "Cfpasto Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.114.2,<1.0.0",
    "python-multipart>=0.0.7,<1.0.0",
    "email-validator>=2.1.0,<3.0.0",
    "tenacity>=8.2.3,<9.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "emails>=0.6,<1.0",
    "jinja2>=3.1.4,<4.0.0",
    "alembic>=1.12.1,<2.0.0",
    "httpx>=0.25.1,<1.0.0",
    "psycopg[binary]>=3.1.13,<4.0.0",
    "sqlalchemy>=2.0,<3.0",
    "pyjwt>=2.8.0,<3.0.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "pillow>=10.0.0",
    "boto3>=1.34.0",
    "slowapi>=0.1.9",
    "redis[hiredis]>=5.0.0",
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3,<8.0.0",
    "mypy>=1.8.0,<2.0.0",
    "ruff>=0.2.2,<1.0.0",
    "coverage>=7.4.3,<8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
